server:
  port: 8082

spring:
  application:
    name: wms-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/smart_wms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:smart123}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 服务间直连地址（compose 内为服务名）
service:
  qms:
    url: ${QMS_URL:http://qms-service:8084}

jwt:
  secret: ${JWT_SECRET:smart-factory-default-secret-key-please-change-in-prod-0123456789abcdef}

logging:
  level:
    com.smartfactory: info
