server:
  port: 8084

spring:
  application:
    name: qms-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/smart_qms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:smart123}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

service:
  wms:
    url: ${WMS_URL:http://wms-service:8082}

jwt:
  secret: ${JWT_SECRET:smart-factory-default-secret-key-please-change-in-prod-0123456789abcdef}

logging:
  level:
    com.smartfactory: info
